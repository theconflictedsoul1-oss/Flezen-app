<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flezen Downloader</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0a0a0a',
                        brandGray: '#1c1c1e',
                        brandTagBg: '#151515',
                        brandBlue: '#5ac8fa',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar hiding for cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="bg-brandDark text-white min-h-screen p-4 flex justify-center">
    
    <div class="w-full max-w-md pb-10">
        
        <!-- Header Section -->
        <div class="flex flex-col items-center mt-6 mb-8">
            <div class="w-12 h-12 rounded-full bg-brandGray flex items-center justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5ac8fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                    <path d="M12 12v9"></path>
                    <path d="m8 17 4 4 4-4"></path>
                </svg>
            </div>
            <h2 class="text-[22px] font-bold text-white mb-1">Flezen Downloader</h2>
            <p class="text-[13px] text-gray-500">Flezen - 17+ platforms - no watermark</p>
        </div>

        <!-- Input Area -->
        <div class="relative w-full mb-3">
            <input 
                type="text" 
                id="linkInput"
                placeholder="Paste a Flezen or any platform link..." 
                class="w-full bg-brandGray text-white rounded-2xl py-4 pl-4 pr-16 outline-none placeholder-gray-500 text-[15px] focus:ring-1 focus:ring-gray-700 transition-all"
            >
            <button 
                onclick="pasteLink()"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-[15px] font-medium hover:text-white transition-colors"
            >
                Paste
            </button>
        </div>

        <!-- Download Button -->
        <button class="w-full bg-brandGray text-gray-600 rounded-2xl py-4 font-medium text-[16px] mb-8 cursor-not-allowed">
            Download
        </button>

        <!-- Platform Tags Grid -->
        <div class="flex flex-wrap justify-center gap-x-2 gap-y-3 mb-10 px-2">
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-pink-400">TikTok</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-orange-400">Instagram</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-blue-400">Twitter / X</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-red-500">YouTube</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-blue-500">Facebook</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-red-400">Pinterest</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-purple-400">Threads</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-green-400">Spotify</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-orange-500">SoundCloud</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-teal-400">CapCut</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-blue-300">Google Drive</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-indigo-400">MediaFire</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-red-500">Xiaohongshu</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-cyan-400">Douyin</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-yellow-400">SnackVideo</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-pink-500">Cocofun</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-orange-300">Kuaishou</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-emerald-400">Flezen</span>
            <span class="px-3 py-1.5 bg-brandTagBg rounded-lg text-[13px] font-medium text-indigo-300">Diskwala</span>
        </div>

        <!-- More Downloaders Section -->
        <div>
            <h3 class="text-[11px] text-gray-500 text-center uppercase tracking-[0.15em] mb-4 font-semibold">More Downloaders</h3>
            
            <div class="flex flex-col gap-2.5">
                
                <!-- Card 1 -->
                <button class="flex items-center justify-between w-full bg-brandGray p-4 rounded-xl hover:bg-[#232325] transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-2.5 h-2.5 rounded-full bg-cyan-400"></div>
                        <span class="text-white text-[15px] font-medium">Terabox Downloader</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17l9.2-9.2M17 17V7H7"/>
                    </svg>
                </button>

                <!-- Card 2 -->
                <button class="flex items-center justify-between w-full bg-brandGray p-4 rounded-xl hover:bg-[#232325] transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-2.5 h-2.5 rounded-full bg-purple-500"></div>
                        <span class="text-white text-[15px] font-medium">Diskwala Downloader</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17l9.2-9.2M17 17V7H7"/>
                    </svg>
                </button>

                <!-- Card 3 -->
                <button class="flex items-center justify-between w-full bg-brandGray p-4 rounded-xl hover:bg-[#232325] transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                        <span class="text-white text-[15px] font-medium">Vidbunker Downloader</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17l9.2-9.2M17 17V7H7"/>
                    </svg>
                </button>

            </div>
        </div>
        
    </div>

    <script>
        // Initialize Telegram Web App SDK
        const tg = window.Telegram.WebApp;
        
        // Expand the mini app to full screen
        tg.expand();
        tg.ready();

        // Paste functionality
        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('linkInput').value = text;
            } catch (err) {
                console.error('Failed to read clipboard contents: ', err);
                // Telegram environment might block clipboard access due to security restrictions
                // Depending on the bot environment, you might just instruct the user to long-press to paste.
                tg.showAlert("Unable to read clipboard. Please long-press and paste manually.");
            }
        }
    </script>
</body>
</html>
